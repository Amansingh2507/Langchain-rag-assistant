readme = "README.md"
authors = [
    { name = "Amansingh2507", email = "amansinghdevil64@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.1",
    "langchain-community>=0.4.2",
